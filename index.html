<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>B&G - Álbum</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --blanco: rgba(255, 255, 255, 0.98);
            --dorado: #b59a5d;
            --oscuro: #2c2c2c;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            color: var(--oscuro);
        }

        .fondo-fijo {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('fondo.jpg');
            background-size: cover;
            background-position: center;
            z-index: -1;
        }

        main {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center; /* Centrado vertical absoluto */
            align-items: center;     /* Centrado horizontal absoluto */
            padding: 20px;
            text-align: center;
        }

        header {
            margin-bottom: 25px; /* Espacio entre nombres y tarjeta */
        }

        h1 { font-family: 'Great Vibes', cursive; font-size: 3.2rem; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); line-height: 1; }
        .slogan { color: white; font-size: 0.9rem; font-style: italic; margin-top: 10px; text-shadow: 1px 1px 3px rgba(0,0,0,0.5); max-width: 280px; }
        
        .card {
            background: var(--blanco);
            padding: 25px 20px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 350px;
        }

        h3 { font-family: 'Great Vibes', cursive; font-size: 2.2rem; color: var(--dorado); margin-bottom: 5px; }
        p.instruccion { font-size: 0.75rem; color: #666; margin-bottom: 15px; }

        .btn {
            background: var(--dorado);
            color: white;
            padding: 14px;
            border-radius: 25px;
            border: none;
            font-size: 0.8rem;
            font-weight: 600;
            display: block;
            width: 100%;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn:active { transform: scale(0.98); }

        .upload-area {
            border: 1.5px dashed var(--dorado);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            background: #fdfaf3;
        }

        .upload-label { font-size: 0.75rem; font-weight: 600; color: var(--dorado); }

        #file-count { font-size: 0.65rem; color: #888; margin-top: 6px; }

        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="fondo-fijo"></div>

    <main>
        <header>
            <h1>Bea y Gabri</h1>
            <p class="slogan">"Vuestras fotos son nuestro mejor recuerdo"</p>
        </header>

        <div class="card">
            <h3>Álbum Digital</h3>
            <p class="instruccion">Sube tus fotos y vídeos del gran día</p>
            
            <form id="uploadForm">
                <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                    <span class="upload-label">📸 SELECCIONAR MULTIMEDIA</span>
                    <div id="file-count">Fotos o vídeos (máx. 10 de golpe)</div>
                    <input type="file" id="fileInput" name="file" multiple accept="image/*,video/*" class="hidden">
                </div>
                
                <button type="submit" id="btnSubir" class="btn">SUBIR AL ÁLBUM</button>
            </form>

            <div id="msgOk" class="hidden">
                <p style="color: var(--dorado); font-weight: bold; margin-top: 10px; font-size: 1rem;">
                    ¡Recibido con éxito! ✨
                </p>
            </div>
        </div>
    </main>

    <script>
        const fileInput = document.getElementById('fileInput');
        const fileCount = document.getElementById('file-count');
        const uploadForm = document.getElementById('uploadForm');

        fileInput.addEventListener('change', () => {
            const num = fileInput.files.length;
            if (num > 0) {
                fileCount.innerText = `${num} archivos seleccionados`;
                fileCount.style.color = "var(--dorado)";
            } else {
                fileCount.innerText = "Fotos o vídeos (máx. 10 de golpe)";
                fileCount.style.color = "#888";
            }
        });

        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (fileInput.files.length === 0) return;

            const btn = document.getElementById('btnSubir');
            btn.disabled = true;
            btn.innerText = "SUBIENDO...";

            const formData = new FormData();
            for (let file of fileInput.files) {
                formData.append('file', file);
            }

            try {
                const response = await fetch('/upload', { method: 'POST', body: formData });
                if (response.ok) {
                    uploadForm.classList.add('hidden');
                    document.getElementById('msgOk').classList.remove('hidden');
                } else {
                    alert("Error al subir los archivos");
                    btn.disabled = false;
                    btn.innerText = "SUBIR AL ÁLBUM";
                }
            } catch (err) {
                alert("Error de conexión con el servidor");
                btn.disabled = false;
                btn.innerText = "SUBIR AL ÁLBUM";
            }
        });
    </script>
</body>
</html>
