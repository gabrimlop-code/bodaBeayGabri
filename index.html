<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>B&G - Álbum</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --blanco: rgba(255, 255, 255, 0.98);
            --dorado: #b59a5d;
            --oscuro: #2c2c2c;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            color: var(--oscuro);
        }

        .fondo-fijo {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('fondo.jpg');
            background-size: cover;
            background-position: center;
            z-index: -1;
        }

        main {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }

        header { margin-bottom: 25px; }

        h1 { font-family: 'Great Vibes', cursive; font-size: 3.2rem; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); line-height: 1; }
        .slogan { color: white; font-size: 0.9rem; font-style: italic; margin-top: 10px; text-shadow: 1px 1px 3px rgba(0,0,0,0.5); max-width: 280px; }
        
        .card {
            background: var(--blanco);
            padding: 25px 20px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 350px;
        }

        h3 { font-family: 'Great Vibes', cursive; font-size: 2.2rem; color: var(--dorado); margin-bottom: 5px; }
        p.instruccion { font-size: 0.75rem; color: #666; margin-bottom: 15px; }

        .btn {
            background: var(--dorado);
            color: white;
            padding: 14px;
            border-radius: 25px;
            border: none;
            font-size: 0.8rem;
            font-weight: 600;
            display: block;
            width: 100%;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn:disabled { background: #ccc; }

        .upload-area {
            border: 1.5px dashed var(--dorado);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            background: #fdfaf3;
        }

        .upload-label { font-size: 0.75rem; font-weight: 600; color: var(--dorado); }
        #file-count { font-size: 0.65rem; color: #888; margin-top: 6px; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="fondo-fijo"></div>

    <main>
        <header>
            <h1>Bea y Gabri</h1>
            <p class="slogan">"Vuestras fotos son nuestro mejor recuerdo"</p>
        </header>

        <div class="card">
            <h3>Álbum Digital</h3>
            <p class="instruccion">Sube tus fotos y vídeos del gran día</p>
            
            <form id="uploadForm">
                <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                    <span class="upload-label">📸 SELECCIONAR MULTIMEDIA</span>
                    <div id="file-count">Fotos o vídeos (máx. 10 de golpe)</div>
                    <input type="file" id="fileInput" name="file" multiple accept="image/*,video/*" class="hidden">
                </div>
                
                <button type="submit" id="btnSubir" class="btn">SUBIR AL ÁLBUM</button>
            </form>

            <div id="msgOk" class="hidden">
                <p style="color: var(--dorado); font-weight: bold; margin-top: 10px; font-size: 1rem;">
                    ¡Enviado con éxito! ✨
                </p>
                <p style="font-size: 0.7rem; color: #666; margin-top: 5px;">Gracias por compartir este momento.</p>
            </div>
        </div>
    </main>

    <script>
        // --- CONFIGURACIÓN ---
        const scriptURL = 'https://script.google.com/macros/s/AKfycbyqWtVv-YMKTlvMeljDZ5u7OncjJ7QmTQZXjlbP541FnwKU8-1aBVivlOXumRr5Yi0I/exec'; // PEGA AQUÍ TU URL QUE TERMINA EN /exec
        // ---------------------

        const fileInput = document.getElementById('fileInput');
        const fileCount = document.getElementById('file-count');
        const uploadForm = document.getElementById('uploadForm');
        const btn = document.getElementById('btnSubir');

        fileInput.addEventListener('change', () => {
            const num = fileInput.files.length;
            if (num > 0) {
                fileCount.innerText = `${num} archivos seleccionados`;
                fileCount.style.color = "var(--dorado)";
            } else {
                fileCount.innerText = "Fotos o vídeos (máx. 10 de golpe)";
                fileCount.style.color = "#888";
            }
        });

        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const files = fileInput.files;
            if (files.length === 0) return;

            btn.disabled = true;
            btn.innerText = "SUBIENDO... (Espera)";

            let subidasFinalizadas = 0;

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const reader = new FileReader();

                reader.onload = async function(event) {
                    const base64 = event.target.result.split(',')[1];
                    const payload = {
                        base64: base64,
                        type: file.type,
                        name: file.name
                    };

                    try {
                        // Enviamos a Google Apps Script
                        await fetch(scriptURL, {
                            method: 'POST',
                            mode: 'no-cors', // Evita problemas de seguridad entre dominios
                            body: JSON.stringify(payload)
                        });

                        subidasFinalizadas++;

                        // Si es el último archivo, mostramos el mensaje de éxito
                        if (subidasFinalizadas === files.length) {
                            uploadForm.classList.add('hidden');
                            document.getElementById('msgOk').classList.remove('hidden');
                        }
                    } catch (err) {
                        console.error(err);
                        alert("Error al subir el archivo: " + file.name);
                        btn.disabled = false;
                        btn.innerText = "SUBIR AL ÁLBUM";
                    }
                };

                reader.readAsDataURL(file);
            }
        });
    </script>
</body>
</html>
