<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bea y Gabri - Álbum Digital</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
    <style>
        :root { --dorado: #b59a5d; --oscuro: #2c2c2c; }
        body, html { height: 100%; margin: 0; font-family: 'Montserrat', sans-serif; text-align: center; color: white; overflow-x: hidden; }
        .fondo { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('fondo.jpg') center/cover; z-index: -1; }
        main { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        h1 { font-family: 'Great Vibes', cursive; font-size: 3.5rem; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .card { background: rgba(255,255,255,0.98); padding: 30px; border-radius: 20px; color: var(--oscuro); width: 100%; max-width: 350px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); box-sizing: border-box; }
        .btn { background: var(--dorado); color: white; padding: 15px 25px; border-radius: 30px; border: none; font-weight: 600; cursor: pointer; width: 100%; font-size: 1rem; transition: transform 0.2s; }
        .btn:active { transform: scale(0.98); }
        .info-box { margin-top: 20px; padding: 12px; background-color: #fdfaf3; border-radius: 12px; border: 1px solid #ffe0b3; text-align: left; }
        .info-title { font-size: 0.7rem; color: #856404; margin-bottom: 8px; font-weight: bold; text-align: center; border-bottom: 1px solid #ffe0b3; padding-bottom: 5px; }
        .info-item { font-size: 0.65rem; color: #856404; margin: 4px 0; display: flex; justify-content: flex-start; }
    </style>
</head>
<body>
    <div class="fondo"></div>
    <main>
        <h1>Bea y Gabri</h1>
        <div class="card">
            <h3 style="font-family: 'Great Vibes'; font-size: 2.2rem; color: var(--dorado); margin: 0 0 10px 0;">Subir Fotos</h3>
            <p style="font-size: 0.8rem; margin-bottom: 20px; color: #666;">Compartid vuestros momentos con nosotros</p>
            
            <button id="upload_widget" class="btn">📸 SELECCIONAR MULTIMEDIA</button>
            
            <div class="info-box">
                <div class="info-title">ℹ️ INFORMACIÓN DE SUBIDA</div>
                <p class="info-item">✅ <b>Máximo 15 archivos</b> por vez</p>
                <p class="info-item">🖼️ <b>Fotos:</b> Hasta 10 MB</p>
                <p class="info-item">🎥 <b>Vídeos:</b> Hasta 100 MB</p>
            </div>
        </div>
    </main>

    <script type="text/javascript">  
        const myWidget = cloudinary.createUploadWidget({
            cloudName: 'duphsbktk', 
            uploadPreset: 'boda_preset',
            sources: ['local'],
            language: 'es',
            maxFiles: 15,
            maxFileSize: 100000000, 
            clientAllowedFormats: ['png', 'jpg', 'jpeg', 'mp4', 'mov', 'quicktime'],
            showCompletedButton: true,
            multiple: true,
            text: {
                es: {
                    menu: { files: "Mis archivos" },
                    local: { browse: "Elegir de la Galería", dd_separator: "o", drop_title: "Suelta aquí" },
                    uploader: { "errors": { "max_files_reached": "Límite: 15 archivos por subida." } }
                }
            },
            styles: {
                palette: {
                    window: "#FFFFFF",
                    windowBorder: "#b59a5d",
                    tabIcon: "#b59a5d",
                    textDark: "#000000",
                    textLight: "#FFFFFF",
                    link: "#b59a5d",
                    action: "#b59a5d",
                    inProgress: "#b59a5d",
                    complete: "#20B832",
                }
            }
        }, (error, result) => { 
            if (!error && result && result.event === "success") { 
                console.log('Completado');
            }
        });

        document.getElementById("upload_widget").addEventListener("click", function(){
            myWidget.open();
        }, false);
    </script>
</body>
</html>
