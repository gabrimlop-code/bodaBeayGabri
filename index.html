<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B&G - Álbum Digital</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
    <style>
        :root { --dorado: #b59a5d; --oscuro: #2c2c2c; }
        body, html { height: 100%; margin: 0; font-family: 'Montserrat', sans-serif; text-align: center; color: white; }
        .fondo { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('fondo.jpg') center/cover; z-index: -1; }
        main { height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        h1 { font-family: 'Great Vibes', cursive; font-size: 3.5rem; margin-bottom: 10px; }
        .card { background: rgba(255,255,255,0.98); padding: 30px; border-radius: 20px; color: var(--oscuro); width: 100%; max-width: 350px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .btn { background: var(--dorado); color: white; padding: 15px 25px; border-radius: 30px; border: none; font-weight: 600; cursor: pointer; width: 100%; font-size: 1rem; }
    </style>
</head>
<body>
    <div class="fondo"></div>
    <main>
        <h1>Bea y Gabri</h1>
        <div class="card">
    <h3 style="font-family: 'Great Vibes'; font-size: 2.2rem; color: var(--dorado);">Subir Fotos</h3>
    <p style="font-size: 0.75rem; margin-bottom: 15px; color: #666;">Compartid vuestros momentos con nosotros</p>
    
    <button id="upload_widget" class="btn">📸 SELECCIONAR MULTIMEDIA</button>
    
    <!-- Aviso técnico basado en tus límites de Cloudinary -->
    <div style="margin-top: 15px; padding: 10px; background-color: #fdfaf3; border-radius: 12px; border: 1px solid #ffe0b3; text-align: left;">
        <p style="font-size: 0.65rem; color: #856404; margin-bottom: 4px;"><strong>Límites del sistema:</strong></p>
        <p style="font-size: 0.62rem; color: #856404;">🖼️ Fotos: Máximo <b>10 MB</b></p>
        <p style="font-size: 0.62rem; color: #856404;">🎥 Vídeos: Máximo <b>100 MB</b></p>
        <p style="font-size: 0.58rem; color: #a0812b; margin-top: 5px; font-style: italic;">*Si el archivo es mayor, no se podrá subir.</p>
    </div>
</div>

<script type="text/javascript">  
const myWidget = cloudinary.createUploadWidget({
            cloudName: 'duphsbktk', 
            uploadPreset: 'boda_preset',
        sources: ['local'], // Solo galería y archivos
        language: 'es',
        // LIMITES ESTRICTOS SEGÚN TU PLAN
        maxFileSize: 100000000, // 100MB para vídeos
        clientAllowedFormats: ['png', 'jpg', 'jpeg', 'mp4', 'mov'],
        
        // Personalización de mensajes y comportamiento
        text: {
            es: {
                menu: { files: "Mis archivos" },
                local: { 
                    browse: "Elegir de la Galería", 
                    dd_separator: "o", 
                    drop_title: "Suelta aquí" 
                },
                queue: {
                    title: "Cola de subida",
                    title_uploading_with_cnt: "Subiendo {{cnt}} archivos",
                    status_error: "Error: Supera el límite",
                }
            }
        },
        styles: {
            palette: {
                window: "#FFFFFF",
                windowBorder: "#b59a5d",
                tabIcon: "#b59a5d",
                textDark: "#000000",
                textLight: "#FFFFFF",
                link: "#b59a5d",
                action: "#b59a5d",
                inProgress: "#b59a5d",
                complete: "#20B832",
            }
        }
    }, (error, result) => { 
        // Si el usuario intenta subir algo de >10MB (foto) daría error interno,
        // Cloudinary lo gestiona mostrando un aviso en el widget.
        if (!error && result && result.event === "success") { 
            console.log('Completado');
        }
    });

    document.getElementById("upload_widget").addEventListener("click", function(){
        myWidget.open();
    }, false);
</script>
</body>
</html>
